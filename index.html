<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Village Prototype</title>
<style>
:root{--bg:#0b0e14;--fg:#e8dcc0;--ac:#c9a15b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Noto Serif Thai',serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;z-index:0;inset:0;width:100%;height:100%}
#hud{position:fixed;z-index:5;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:13px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none}
#zone{font-size:16px;color:var(--ac)}
#warn{color:#ff6a5a;font-weight:bold;min-height:1.5em}
#hpw{position:relative;width:150px;height:14px;margin:2px 0;background:#140606cc;border:1px solid var(--ac);border-radius:3px;overflow:hidden}
#hpf{position:absolute;inset:0;width:100%;background:linear-gradient(#e0553f,#9a1c10);transition:width .25s}
#hpt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px}
#end{display:none;position:fixed;inset:0;z-index:30;background:#000c;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#et{margin:0;font-size:44px;color:var(--ac)}#ep{white-space:pre-line;font-size:18px}
#er{background:#5a1a12;color:var(--ac);border:2px solid var(--ac);padding:12px 28px;font:inherit;font-size:18px;border-radius:8px}
#btn{position:fixed;z-index:5;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#1b1610cc;color:var(--ac);border:1px solid var(--ac);padding:10px 14px;font:inherit;border-radius:6px}
#joy,.sk{display:none}
@media (pointer:coarse){
#joy{display:block;position:fixed;z-index:5;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);width:130px;height:130px;border-radius:50%;background:#1b161066;border:2px solid #c9a15b88}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#c9a15bcc;box-shadow:0 2px 8px #000a}
.sk{display:block;position:fixed;z-index:5;border-radius:50%;background:#1b1610d9;color:var(--ac);border:2px solid var(--ac);font:inherit;font-size:26px;padding:0;box-shadow:0 2px 10px #000a;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:none}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
#atk{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:96px;height:96px;font-size:38px;border-color:#e0553f;background:#5a1a12e6}
#s1{right:147px;bottom:calc(env(safe-area-inset-bottom,0px) + 55px);width:58px;height:58px}
#s2{right:118px;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);width:58px;height:58px}
#s3{right:47px;bottom:calc(env(safe-area-inset-bottom,0px) + 155px);width:58px;height:58px}
#s4{right:188px;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);width:58px;height:58px}
#s5{right:121px;bottom:calc(env(safe-area-inset-bottom,0px) + 196px);width:58px;height:58px}
.sk.on{background:var(--ac);color:#1b1610}
}
#quest,#prompt,#dlg,#shout,#fmsg,#fade{position:fixed;text-shadow:0 1px 4px #000}
#quest{z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);max-width:42vw;text-align:center;font-size:13px;color:#f1d38a;pointer-events:none}
#prompt{z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);color:#fff;background:#000a;padding:6px 12px;border-radius:6px;font-size:14px;pointer-events:none}
#prompt:empty{display:none}
#dlg{display:none;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:min(560px,92vw);box-sizing:border-box;background:#120e0aee;border:2px solid var(--ac);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.5}
#dn{color:var(--ac);display:block;margin-bottom:4px}
#dlg small{display:block;text-align:right;opacity:.6;font-size:11px}
#shout{z-index:7;top:28%;left:50%;transform:translateX(-50%);font-size:28px;white-space:pre-line;max-width:90vw;font-weight:bold;color:#ffcf7a;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#fade{z-index:20;inset:0;background:#000;opacity:0;transition:opacity 1.4s;pointer-events:none}
#fmsg{z-index:21;top:45%;left:50%;transform:translateX(-50%);font-size:26px;color:#e8dcc0;opacity:0;transition:opacity 1s;pointer-events:none;white-space:normal;width:88vw;text-align:center}
#it{right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 232px);width:64px;height:64px;font-size:26px;border-color:#6fd16f;color:#fff}
@media (pointer:coarse){#dlg{left:170px;right:270px;width:auto;transform:none}#prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}}
#bark{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 74px);left:50%;transform:translateX(-50%);max-width:56vw;text-align:center;font-size:14px;font-style:italic;color:#ffe2a8;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .4s;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,#000b 100%)}
#wp{position:fixed;z-index:5;left:0;top:0;pointer-events:none;color:#ffd24a;text-align:center;font:bold 14px Georgia,serif;text-shadow:0 1px 4px #000,0 0 6px #000;display:none;transform:translate(-50%,-50%)}#wp b{display:block;font-size:28px;line-height:1}
</style></head><body>
<div id="hud"><div id="zone"></div><div id="hpw"><i id="hpf"></i><b id="hpt">100/100</b></div><div id="army"></div><div id="warn"></div></div>
<button id="btn">📷 สลับมุมมอง (V)</button>
<div id="joy"><div id="knob"></div></div>
<button id="atk" class="sk">⚔️</button>
<button id="s1" class="sk">💨</button>
<button id="s2" class="sk">🔥</button>
<button id="s3" class="sk">🏃</button>
<button id="s4" class="sk">🪓</button>
<button id="s5" class="sk">🛡️</button>
<div id="wp"><b id="wa">◆</b><span id="wd"></span></div><div id="quest"></div><div id="bark"></div><div id="prompt"></div>
<div id="dlg"><b id="dn"></b><div id="dt"></div><small>แตะ / กด E เพื่อไปต่อ</small></div>
<div id="end"><h1 id="et"></h1><p id="ep"></p><button id="er">⚔ เล่นใหม่</button></div><div id="fade"></div><div id="fmsg">รุ่งเช้าแห่งสงคราม...</div><div id="shout"></div>
<button id="it" class="sk" style="display:none">E</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3=THREE.Vector3,R=(a,b)=>a+Math.random()*(b-a);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),SKY=0x06080d;
scene.background=new THREE.Color(SKY);scene.fog=new THREE.FogExp2(SKY,0.0085);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,1000);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---------- helpers ----------
function tex(c,v,rep,w=128){const k=document.createElement('canvas');k.width=k.height=w;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,w,w);
 for(let i=0;i<2200;i++){g.fillStyle=Math.random()<.6?`rgba(0,0,0,${Math.random()*v})`:`rgba(255,255,255,${Math.random()*v*.4})`;g.fillRect(Math.random()*w,Math.random()*w,2,2)}
 const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.encoding=THREE.sRGBEncoding;return t}
const M=(c,r=.9,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},x));
const wood=M(0x4a3222),plaster=M(0xa58f68),roofM=M(0x4a2a1e),stone=M(0x6a675f,1),dark=M(0x1a120c),skin=M(0xc79a78);
const box=(w,h,d,m,x,y,z,p=scene)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const cyl=(rt,rb,h,s,m,x,y,z,p=scene)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const col=[];

// ---------- lights & sky ----------
const hemi=new THREE.HemisphereLight(0x2a3552,0x120e0a,0.4);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x6f86b8,0.5);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);
Object.assign(moon.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:200});moon.shadow.bias=-0.0006;
scene.add(moon,moon.target);
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(8,16,16),new THREE.MeshBasicMaterial({color:0xdfe8ff,fog:false}));moonMesh.position.set(-120,140,-200);scene.add(moonMesh);
{const p=[];for(let i=0;i<600;i++){const a=R(0,6.28),b=R(.15,1.4);p.push(Math.cos(a)*Math.cos(b)*380,Math.sin(b)*380,Math.sin(a)*Math.cos(b)*380)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 var starM=new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false,transparent:true});var starP=new THREE.Points(g,starM);starP.frustumCulled=false;scene.add(starP)}

// ---------- terrain: grass, river, road ----------
const OFF=600,RZ=-OFF,VX=70,VZ1=46,VZ2=172,GW=6,PZ=100,WZ=108;let _sg=null;
function beginShift(){_sg=new THREE.Group();_sg.position.z=-OFF;scene.add(_sg);const g=_sg;scene.add=o=>g.add(o);col.push=(...a)=>a.forEach(c=>Array.prototype.push.call(col,[c[0],c[1]-OFF,c[2]]))}
function endShift(){delete scene.add;delete col.push}
const grassT=tex('#2c3a22',.5,60,128),grass=M(0xffffff,1,{map:grassT});
[[(VZ2+40+RZ+6)/2,VZ2+40-RZ-6],[RZ-63,114]].forEach(([z,L])=>{const t=grassT.clone();t.needsUpdate=true;t.repeat.set(120,60*L/114);const g=new THREE.Mesh(new THREE.PlaneGeometry(600,L),M(0xffffff,1,{map:t}));g.rotation.x=-Math.PI/2;g.position.set(0,0,z);g.receiveShadow=true;scene.add(g)});
beginShift();const bed=new THREE.Mesh(new THREE.PlaneGeometry(300,12),M(0x2a2218));bed.rotation.x=-Math.PI/2;bed.position.set(0,-1.5,0);scene.add(bed);
[-6,6].forEach(z=>box(300,1.5,.2,M(0x3a2c1c),0,-.75,z));
const waterT=tex('#1d3a4a',.25,40,64);
const water=new THREE.Mesh(new THREE.PlaneGeometry(300,12),M(0xffffff,.15,{map:waterT,metalness:.4,transparent:true,opacity:.9}));
water.rotation.x=-Math.PI/2;water.position.y=-.4;scene.add(water);
endShift();const roadT=tex('#5a4630',.6,1,128);
[[140-RZ-6,(140+RZ+6)/2],[74,RZ-43]].forEach(([len,z])=>{const t=roadT.clone();t.needsUpdate=true;t.repeat.set(1,len/5);const r=new THREE.Mesh(new THREE.PlaneGeometry(5,len),M(0xffffff,1,{map:t}));r.rotation.x=-Math.PI/2;r.position.set(0,.03,z);r.receiveShadow=true;scene.add(r)});
beginShift();// bridge (narrow)
box(3.4,.3,13,wood,0,-.05,0);
[-1.6,1.6].forEach(x=>{box(.12,.9,13,wood,x,.55,0);for(let z=-6;z<=6;z+=3)box(.2,1,.2,wood,x,.5,z)});
endShift();
// ---------- objects ----------
function wallLine(x1,z1,x2,z2,hmin,hmax,m,skip=0){const dx=x2-x1,dz=z2-z1,n=Math.ceil(Math.hypot(dx,dz)/1.8);
 for(let i=0;i<=n;i++){if(Math.random()<skip)continue;const x=x1+dx*i/n,z=z1+dz*i/n,h=R(hmin,hmax);
  const o=box(1.9,h,1.1,m,x,h/2,z);o.rotation.y=-Math.atan2(dz,dx);o.rotation.z=R(-.04,.04);col.push([x,z,1])}}
function house(x,z,ry,w,d){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
 box(w,3,d,plaster,0,1.5,0,g);
 [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.26,3.1,.26,wood,a*w/2,1.55,b*d/2,g));
 [1.6,2.9].forEach(y=>[-1,1].forEach(s=>box(w+.05,.18,.12,wood,0,y,s*d/2,g)));
 const gg=new THREE.ConeGeometry(.7071,1,4);gg.rotateY(Math.PI/4);
 const r=new THREE.Mesh(gg,roofM);r.scale.set(w+1.2,2.6,d+1.2);r.position.y=4.3;r.castShadow=true;g.add(r);
 box(.9,.9,.9,stone,w/3,4.4,0,g);
 box(1,2.1,.1,dark,0,1.05,d/2+.05,g);
 box(.8,.7,.1,M(0x000000,.5,{emissive:0xffa040,emissiveIntensity:1.4}),w/3,1.9,d/2+.05,g);
 g.updateMatrixWorld(true);chim.push(g.localToWorld(new V3(w/3,5,0)));col.push([x,z,Math.max(w,d)/2+.3])}
function man(c,helm,s=1,shield=false,knight=false){
 const g=new THREE.Group(),root=new THREE.Group(),hips=new THREE.Group();g.add(root);hips.position.y=.95;root.add(hips);
 // ---- แชร์ geometry/material ข้ามทุกตัวละคร (ลด GPU memory) / ob(...,0) = ไม่ทอดเงา ----
 const GC=man.G||(man.G={}),MC=man.Mt||(man.Mt={});
 const G=(T,...a)=>{const k=T+a;return GC[k]||(GC[k]=new THREE[T+'Geometry'](...a))};
 const Mt=(col,r=.9,mtl=0)=>{const k=col+'_'+r+'_'+mtl;return MC[k]||(MC[k]=M(col,r,mtl?{metalness:mtl}:{}))};
 const ob=(geo,m,x,y,z,p,sh=1)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=!!sh;p.add(o);return o};
 const mc=Mt(c,.8),lt=Mt(0x3a2a1c,.9),sk=Mt(0xc79a78,.8),pm=Mt(0x2a2420,.9),mt=Mt(0x9a9a9a,.35,.8),steel=Mt(0xc8ccd2,.25,.9),
  st=Mt(0xaab0bb,.38,.45),dk=Mt(0x6a7079,.5,.45),br=Mt(0xb8923a,.4,.5),sl=Mt(0x08080a,1); // st/dk = เหล็กแผ่น (metalness ต่ำ เพราะฉากไม่มี envMap)
 // ---- ลำตัว: เสื้อเกราะอกโค้งนูน + ชายเกราะซ้อน + เข็มขัด + กระโปรง surcoat สีประจำฝ่าย ----
 const torso=new THREE.Group();torso.position.y=.03;hips.add(torso);
 ob(G('Cylinder',.27,.21,.62,10),helm?st:mc,0,.33,0,torso).scale.set(1.15,1,.75);
 if(helm){
  ob(G('Sphere',.24,10,8),st,0,.44,-.04,torso).scale.set(1.2,.95,.78);        // อกนูนโค้ง
  ob(G('Box',.03,.42,.03),dk,0,.4,-.226,torso,0);                              // สันกลางอก
  [[-.06,.25,.265,st],[-.14,.27,.29,dk]].forEach(([y,r1,r2,m])=>ob(G('Cylinder',r1,r2,.08,10),m,0,y,0,torso,0).scale.set(1.12,1,.88)); // ชายเกราะซ้อน 2 ชั้น
  ob(G('Cylinder',.12,.15,.1,8),st,0,.68,0,torso,0);                           // คอเกราะ
 }else ob(G('Cylinder',.06,.07,.1,8),sk,0,.68,0,torso,0);
 ob(G('Cylinder',.225,.225,.09,10),lt,0,.02,0,torso,0).scale.set(1.12,1,.82);  // เข็มขัด
 ob(G('Box',.07,.07,.03),br,0,.02,-.19,torso,0);                               // หัวเข็มขัด
 ob(G('Cylinder',.22,.31,.34,10),mc,0,-.13,0,hips).scale.z=.85;                 // กระโปรง
 // ---- ศีรษะ: ใส่หมวกแล้วปิดมิดชิด / knight = Great Helm, อื่น ๆ = Bascinet ----
 const head=new THREE.Group();head.position.y=.84;torso.add(head);
 if(helm&&knight){
  ob(G('Cylinder',.19,.2,.36,10),st,0,.01,0,head);                             // ตัวหมวกทรงถัง
  ob(G('Cylinder',.2,.2,.03,10),dk,0,.2,0,head,0);                             // แผ่นปิดบน
  ob(G('Box',.03,.32,.02),dk,0,0,-.195,head,0);                                // แถบเสริมตั้ง
  ob(G('Box',.16,.035,.02),sl,0,.05,-.19,head,0);                              // ช่องมองแนวนอน
  ob(G('Box',.03,.09,.02),sl,0,-.03,-.19,head,0);                              // ช่องมองแนวตั้ง (กากบาท)
 }else if(helm){
  ob(G('Sphere',.18,12,10),st,0,.02,.005,head).scale.set(1,1.12,1.06);         // โดมหมวก
  ob(G('Cylinder',.17,.2,.12,10),dk,0,-.14,.02,head,0);                        // เกราะคลุมคอ (aventail)
  ob(G('Cone',.105,.2,8),st,0,-.015,-.205,head,0).rotation.x=-Math.PI/2;       // หน้ากากปากแหลม
  ob(G('Box',.17,.02,.02),sl,0,.045,-.185,head,0);                             // ช่องมอง
  const rg=ob(G('Torus',.2,.014,5,10,Math.PI),dk,0,.02,.005,head,0);rg.scale.set(.95,1,1);rg.rotation.y=Math.PI/2; // สันหมวก
 }else{
  ob(G('Sphere',.15,14,12),sk,0,0,0,head).scale.y=1.1;
  [-1,1].forEach(a=>ob(G('Sphere',.018,6,6),pm,a*.055,.02,-.135,head,0));
  ob(G('Sphere',.165,12,10,0,6.283,0,1.5),Mt(0x3a2a1a),0,.03,.01,head,0);
 }
 // ---- แขน (ไหล่เกราะซ้อน 3 ชั้น) + ขา (หัวเข่า/แข้งเกราะ) ----
 const lu=[],kn=[],ar=[],el=[];
 [-1,1].forEach(a=>{
  const A=new THREE.Group();A.position.set(a*.36,.58,0);torso.add(A);
  const E=new THREE.Group();E.position.y=-.34;A.add(E);
  if(helm){
   ob(G('Sphere',.12,10,8),st,a*.02,.02,0,A).scale.set(1.2,.8,1.1);            // ฝาไหล่
   ob(G('Cylinder',.125,.105,.07,10),dk,a*.015,-.07,0,A,0);                    // แผ่นซ้อนชั้น 1
   ob(G('Cylinder',.11,.092,.07,10),st,a*.01,-.13,0,A,0);                      // แผ่นซ้อนชั้น 2
  }else ob(G('Sphere',.1,10,8),mc,0,0,0,A);
  ob(G('Cylinder',.075,.06,.34,8),mc,0,-.17,0,A);
  ob(G('Cylinder',.058,.05,.32,8),helm?st:sk,0,-.16,0,E,0);                    // ปลอกแขนท่อนล่าง
  ob(G('Sphere',.06,8,8),helm?dk:sk,0,-.34,0,E,0);                             // ถุงมือเกราะ
  if(helm)ob(G('Sphere',.068,8,6),st,0,0,0,E,0);                               // ข้อศอก
  ar.push(A);el.push(E);
  const L=new THREE.Group();L.position.set(a*.12,0,0);hips.add(L);
  ob(G('Cylinder',.1,.075,.46,8),pm,0,-.23,0,L);
  const K=new THREE.Group();K.position.y=-.46;L.add(K);
  ob(G('Sphere',helm?.088:.078,8,8),helm?st:pm,0,0,0,K,0);                     // เกราะหัวเข่า
  ob(G('Cylinder',.075,.06,.44,8),helm?st:pm,0,-.22,0,K);                      // เกราะแข้ง
  ob(G('Box',.13,.1,.28),helm?dk:lt,0,-.46,-.05,K,0);                          // รองเท้าเกราะ
